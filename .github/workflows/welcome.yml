name: 💬 Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Спасибо за ваш issue!

            Job Fit Copilot — проект с открытым исходным кодом, и каждый вопрос/предложение делает его лучше.

            ⏱ **Обычно отвечаем в течение 24 часов** (по будням).
            💬 Есть Telegram-чат: [@jobfitcopilot_chat](https://t.me/jobfitcopilot_chat)
            ⭐ Не забудьте поставить звезду, если проект полезен!

          pr-message: |
            🎉 Спасибо за ваш Pull Request!

            **Что дальше?**
            1. Убедитесь, что тесты проходят: `npm test && cd server && npm test`
            2. Проверьте линтер: `npx eslint .`
            3. Если меняете UI — приложите скриншот

            После проверки мейнтейнер ответит в течение 48 часов.
            Спасибо, что делаете проект лучше! 🚀
