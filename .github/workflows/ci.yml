name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # no-undef ловит класс ошибок, из-за которого в v0.4.4 уехали вызовы
      # несуществующих функций: `node --check` их не видит, он проверяет
      # только синтаксис, а ESLint — что функция определена.
      - name: Lint
        run: npm run lint

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: npm audit (root)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: npm audit (server)
        working-directory: server
        run: npm ci && npm audit --audit-level=high || true
        continue-on-error: true

      - name: npm audit (site)
        working-directory: site
        run: npm ci && npm audit --audit-level=high || true
        continue-on-error: true

  test-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Extension tests
        run: npm test

  test-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test

  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build
