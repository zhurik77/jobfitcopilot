name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            If this is still relevant, please leave a comment to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not
            had recent activity. It will be closed in 7 days if no further activity
            occurs. If this is still a work in progress, please leave a comment to keep
            it open.
          close-issue-message: >
            This issue has been automatically closed due to inactivity. Feel free to
            reopen if the issue persists or becomes relevant again.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity. Please
            feel free to reopen if you plan to continue working on it.
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,hr-expert
          exempt-pr-labels: pinned,security,hr-expert
