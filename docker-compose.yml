services:
  jobfit-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # Только loopback: панель и MCP не должны быть видны из сети.
      - "127.0.0.1:8765:8765"
    environment:
      DB_PATH: /data/jobfit.db
      WEBBRIDGE_URL: http://host.docker.internal:10086
      CDEK_LLM_URL: http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jobfit-data:/data
    restart: unless-stopped

volumes:
  jobfit-data:
